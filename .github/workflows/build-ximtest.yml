name: Build XIM test client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Show source
        run: |
          ls -la ximtest/
          head -5 ximtest/ximtest.c

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libx11-dev

      - name: Compile
        run: |
          gcc -O1 -Wall -o ximtest/ximtest ximtest/ximtest.c -lX11
          ls -la ximtest/ximtest

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ximtest
          path: ximtest/ximtest
          retention-days: 30